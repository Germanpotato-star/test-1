<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tamagotchi</title>

<style>
body{
    background:#87ceeb;
    font-family:monospace;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

#game{
    width:400px;
    background:#fff;
    border:6px solid #222;
    border-radius:20px;
    padding:20px;
    box-shadow:8px 8px 0 #222;
}

h1{
    text-align:center;
    margin-top:0;
}

#petDisplay{
    text-align:center;
    font-size:90px;
    margin:10px 0;
    height:120px;
}

.stats{
    margin:15px 0;
}

.stat{
    margin:8px 0;
}

.bar{
    width:100%;
    height:20px;
    background:#ddd;
    border:2px solid #222;
}

.fill{
    height:100%;
    background:#4caf50;
    width:100%;
}

#message{
    text-align:center;
    font-weight:bold;
    min-height:24px;
    margin:10px 0;
}

.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

button{
    padding:12px;
    font-size:16px;
    cursor:pointer;
    border:3px solid #222;
    background:#f5f5f5;
    font-family:monospace;
}

button:hover{
    background:#e0e0e0;
}

#age{
    text-align:center;
    margin-top:10px;
    font-weight:bold;
}

.dead{
    color:red;
}
</style>
</head>
<body>

<div id="game">
    <h1>TAMAGOTCHI</h1>

    <div id="petDisplay">🐣</div>

    <div id="message">Your pet is happy!</div>

    <div class="stats">

        <div class="stat">
            Hunger
            <div class="bar">
                <div class="fill" id="hungerBar"></div>
            </div>
        </div>

        <div class="stat">
            Happiness
            <div class="bar">
                <div class="fill" id="happyBar"></div>
            </div>
        </div>

        <div class="stat">
            Energy
            <div class="bar">
                <div class="fill" id="energyBar"></div>
            </div>
        </div>

        <div class="stat">
            Health
            <div class="bar">
                <div class="fill" id="healthBar"></div>
            </div>
        </div>

    </div>

    <div class="buttons">
        <button onclick="feed()">🍎 Feed</button>
        <button onclick="play()">⚽ Play</button>
        <button onclick="sleepPet()">😴 Sleep</button>
        <button onclick="medicine()">💊 Medicine</button>
    </div>

    <div id="age">Age: 0 days</div>
</div>

<script>
const pet = {
    hunger:100,
    happiness:100,
    energy:100,
    health:100,
    age:0,
    alive:true
};

function clamp(value){
    return Math.max(0, Math.min(100, value));
}

function updateBars(){
    document.getElementById("hungerBar").style.width = pet.hunger + "%";
    document.getElementById("happyBar").style.width = pet.happiness + "%";
    document.getElementById("energyBar").style.width = pet.energy + "%";
    document.getElementById("healthBar").style.width = pet.health + "%";

    document.getElementById("age").textContent =
        "Age: " + pet.age + " days";

    updatePetAppearance();
}

function updatePetAppearance(){
    const petDisplay = document.getElementById("petDisplay");

    if(!pet.alive){
        petDisplay.textContent = "💀";
        return;
    }

    if(pet.health < 30){
        petDisplay.textContent = "🤒";
    }
    else if(pet.energy < 30){
        petDisplay.textContent = "😴";
    }
    else if(pet.happiness < 30){
        petDisplay.textContent = "😢";
    }
    else if(pet.age < 5){
        petDisplay.textContent = "🐣";
    }
    else if(pet.age < 15){
        petDisplay.textContent = "🐤";
    }
    else{
        petDisplay.textContent = "🐥";
    }
}

function setMessage(msg){
    document.getElementById("message").textContent = msg;
}

function feed(){
    if(!pet.alive) return;

    pet.hunger = clamp(pet.hunger + 25);
    pet.health = clamp(pet.health + 5);

    setMessage("Yum! That was tasty.");
    updateBars();
}

function play(){
    if(!pet.alive) return;

    pet.happiness = clamp(pet.happiness + 20);
    pet.energy = clamp(pet.energy - 10);

    setMessage("Your pet had fun!");
    updateBars();
}

function sleepPet(){
    if(!pet.alive) return;

    pet.energy = clamp(pet.energy + 35);

    setMessage("Your pet feels rested.");
    updateBars();
}

function medicine(){
    if(!pet.alive) return;

    pet.health = clamp(pet.health + 25);

    setMessage("Medicine helped.");
    updateBars();
}

function gameTick(){
    if(!pet.alive) return;

    pet.hunger = clamp(pet.hunger - 4);
    pet.happiness = clamp(pet.happiness - 3);
    pet.energy = clamp(pet.energy - 2);

    if(pet.hunger < 20) pet.health -= 4;
    if(pet.happiness < 20) pet.health -= 2;
    if(pet.energy < 20) pet.health -= 3;

    pet.health = clamp(pet.health);

    if(pet.health <= 0){
        pet.alive = false;

        document.getElementById("message").innerHTML =
            "<span class='dead'>Your pet has passed away.</span>";

        updateBars();
        return;
    }

    updateBars();
}

function ageTick(){
    if(!pet.alive) return;

    pet.age++;
    updateBars();
}

updateBars();

setInterval(gameTick, 5000);
setInterval(ageTick, 30000);
</script>

</body>
</html>
